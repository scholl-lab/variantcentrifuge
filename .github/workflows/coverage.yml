name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Separate from test.yml: release.yml calls test.yml with read-only permissions.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Coverage badge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # sysmon (Python 3.12+) is coverage's low-overhead tracer; no branch coverage is configured.
      - name: Run tests with coverage
        env:
          COVERAGE_CORE: sysmon
        run: python -m pytest -n auto --dist worksteal -m "not slow and not integration" tests/ --cov=variantcentrifuge -q

      # ponytail: fork PRs get no comment (read-only token); add a workflow_run companion if needed.
      - name: Publish coverage badge and PR comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
