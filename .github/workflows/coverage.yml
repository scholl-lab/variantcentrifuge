name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Separate from test.yml: release.yml calls test.yml with read-only permissions.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage badge
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests with coverage
        run: .venv/bin/python -m pytest -n auto -m "not slow and not integration" tests/ --cov=variantcentrifuge -q

      # ponytail: fork PRs get no comment (read-only token); add a workflow_run companion if needed.
      - name: Publish coverage badge and PR comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
