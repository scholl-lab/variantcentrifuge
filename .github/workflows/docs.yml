name: Documentation Build

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "variantcentrifuge/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "variantcentrifuge/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR builds cancel superseded runs; main deploys queue so Pages never deploys out of order.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: "docs/requirements.txt"

      - name: Install documentation dependencies
        run: |
          uv pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          cd docs
          make clean
          make html
          echo "Documentation built successfully"

      - name: Validate build
        run: |
          if [ -f "docs/build/html/index.html" ]; then
            echo "✓ Documentation built successfully"
          else
            echo "✗ Documentation build failed"
            exit 1
          fi

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
