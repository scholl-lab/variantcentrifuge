[build-system]
requires = ["setuptools>=64", "cffi>=1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "variantcentrifuge"
dynamic = ["version"]
description = "A tool to filter, extract, and analyze variants from VCF files."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    { name = "Bernt Popp", email = "bernt.popp.md@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pandas",
    "pyarrow>=14.0",
    "jinja2",
    "scipy",
    "statsmodels",
    "numpy",
    "intervaltree",
    "psutil",
    "smart-open<9",
    "openpyxl",
    "xlsxwriter>=3.0",
    "cffi",
]

[project.optional-dependencies]
dev = [
    "setuptools>=64",
    "mypy>=1.10",
    "numpy<2.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=5.1.0",
    "ruff>=0.11,<0.18",
    "pre-commit",
    "types-psutil",
]

[project.scripts]
variantcentrifuge = "variantcentrifuge.cli:main"
variantcentrifuge-build-pm5 = "variantcentrifuge.build_pm5_lookup:main"

[tool.setuptools.dynamic]
version = {attr = "variantcentrifuge.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["variantcentrifuge*"]

[tool.setuptools.package-data]
variantcentrifuge = ["config.json", "default_stats_config.json", "templates/*.html", "assets/*/*"]

[tool.pytest.ini_options]
# Test file patterns
python_files = ["test_*.py", "*_test.py", "benchmark_*.py"]
# Default options: summary of non-passing tests, short tracebacks, strict markers
addopts = "-ra --tb=short --strict-markers --color=yes --benchmark-disable"
pythonpath = ["."]
# Focus test collection on the tests directory
testpaths = ["tests"]
# Registered markers
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take a long time to run",
    "helpers: Tests for helper functions",
    "replacer: Tests for replacer.py",
    "analyze: Tests for analyze_variants.py",
    "phenotype: Tests for phenotype data integration",
    "inheritance: Tests for inheritance analysis",
    "deducer: Tests for pattern deduction",
    "comp_het: Tests for compound heterozygous analysis",
    "segregation: Tests for segregation analysis",
    "prioritizer: Tests for pattern prioritization",
    "gene_burden: Tests for gene burden analysis",
    "performance: Performance benchmark tests",
    "coast: COAST allelic series tests",
    "e2e: Real-data end-to-end tests (need bcftools/SnpSift; run with make test-e2e)",
]
# Live console logging disabled by default for performance.
# Enable when needed: pytest --log-cli-level=INFO
log_cli = false

[tool.ruff]
line-length = 100
target-version = "py312"
required-version = ">=0.11,<0.16"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# Migrated from .flake8 per-file-ignores
per-file-ignores = { "__init__.py" = ["F401"], "cli.py" = ["E501"], "helpers.py" = ["E501"], "pipeline.py" = ["E501"], "filters.py" = ["E501"], "generate_igv_report.py" = ["E501"], "links.py" = ["E501"], "replacer.py" = ["E501"], "stats.py" = ["E501"], "vcf_eff_one_per_line.py" = ["E501"] }
# E203: whitespace before ':' (conflicts with ruff formatter)
# E402: module-level import not at top (needed for conditional imports)
extend-ignore = [
    "E203",
    "E402",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["variantcentrifuge"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Third-party libraries without official PEP 561 type stubs or compiled C extensions:
# - intervaltree, smart_open, rpy2, statsmodels, openpyxl: Third-party libs lacking PEP 561 py.typed stubs
# - pandas, scipy, matplotlib: Partial/optional typing across diverse runtime environments
# - cffi: Dynamically generated CFFI builder stubs
[[tool.mypy.overrides]]
module = [
    "intervaltree.*",
    "smart_open.*",
    "rpy2.*",
    "statsmodels.*",
    "openpyxl.*",
    "pandas",
    "scipy",
    "scipy.*",
    "matplotlib",
    "matplotlib.*",
    "cffi",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["variantcentrifuge"]
relative_files = true
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
fail_under = 75
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
