$schema: "https://json-schema.org/draft/2020-12/schema"
description: Configuration for the variantcentrifuge Snakemake workflow.

type: object

properties:
  paths:
    type: object
    properties:
      samples:
        type: string
        description: Path to the samples TSV file.
      vcf_folder:
        type: string
        description: Directory containing .vcf.gz input files.
      output_folder:
        type: string
        description: Root output directory (subdirs per sample).
      log_subdir:
        type: string
        default: "logs"
        description: Subdirectory for rule log files.
    required:
      - samples
      - vcf_folder
      - output_folder

  variantcentrifuge:
    type: object
    properties:
      config_file:
        type: string
        description: Path to the main variantcentrifuge JSON config.
      genes:
        type: string
        default: "all"
        description: Gene filter (gene name, "all", or path to gene-list file).
      log_level:
        type: string
        enum: ["DEBUG", "INFO", "WARN", "ERROR"]
        default: "INFO"
      threads:
        type: integer
        minimum: 1
        default: 8
      add_chr:
        type: boolean
        default: false
      generate_xlsx:
        type: boolean
        default: true
      generate_html_report:
        type: boolean
        default: true
      field_profile:
        type:
          - "string"
          - "null"
        default: null
        description: Field profile name (null uses the default profile).
      presets:
        type: array
        items:
          type: string
        default: []
      preset:
        type:
          - "string"
          - "array"
          - "null"
        default: null
      filters:
        type:
          - "string"
          - "null"
        default: null
      transcript_file:
        type:
          - "string"
          - "null"
        default: null
      transcript_list:
        type:
          - "string"
          - "null"
        default: null
      final_filter:
        type:
          - "string"
          - "null"
        default: null
      filter_exception_file:
        type:
          - "string"
          - "null"
        default: null
        description: >-
          Path to a 5-column TSV of somatic hotspots rescued to FILTER=PASS
          during VCF filtering (does not apply to bcftools_prefilter or late_filtering).
      fail_on_empty:
        type: boolean
        default: false
      append_genotype_fields:
        type: array
        items:
          type: string
        default: []
      gene_list_files:
        type: array
        items:
          type: string
        default: []
      tumor_sample_index:
        type:
          - "integer"
          - "null"
        default: null
        description: 0-based index of tumor sample in VCF.
      normal_sample_index:
        type:
          - "integer"
          - "null"
        default: null
        description: 0-based index of normal sample in VCF.
      reference:
        type:
          - "string"
          - "null"
        default: null
        description: Reference genome build (e.g. GRCh37.75, GRCh38.86).
      regions_bed:
        type:
          - "string"
          - "null"
        default: null
        description: Path to restriction BED file.
    required:
      - config_file

  igv:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      reference:
        type: string
        default: ""
      bam_mapping_file:
        type: string
        default: ""
      fasta:
        type:
          - "string"
          - "null"
        default: null
      ideogram:
        type:
          - "string"
          - "null"
        default: null
      flanking:
        type: integer
        minimum: 0
        default: 50

  container:
    type: object
    properties:
      image:
        type: string
        default: ""
        description: >
          Singularity / Apptainer image URI
          (e.g. "docker://ghcr.io/scholl-lab/variantcentrifuge:0.10.0").
          Empty string disables container execution.

required:
  - paths
  - variantcentrifuge
